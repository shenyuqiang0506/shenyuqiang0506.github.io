<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能题目抽奖 (自动降低重复率)</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --tag-bg: #e1ecf4;
            --tag-text: #39739d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        /* 顶部统计栏 */
        .stats-bar {
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
            display: flex;
            gap: 20px;
        }

        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            font-weight: bold;
        }

        button:hover {
            background-color: #357abd;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* 重置按钮样式 */
        .btn-reset {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-reset:hover {
            background-color: #e0e0e0;
        }

        /* 下载按钮样式 */
        .btn-download {
            background-color: #28a745;
            text-decoration: none;
            display: inline-block;
        }

        .btn-download:hover {
            background-color: #218838;
        }

        .question-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 40px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; /* 默认居中，显示题目时改为 flex-start */
            text-align: left;
            position: relative;
        }

        /* 顶部状态标签 */
        .header-tags {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .tag-id {
            background: #eee;
            color: #555;
        }

        .tag-count {
            background: #ffeebb;
            color: #996600;
        }

        .tag-new {
            background: #d4edda;
            color: #155724;
        }

        .question-content {
            width: 100%;
            font-size: 1.1em;
            line-height: 1.6;
            color: #444;
        }

        .question-content pre {
            background: #f6f8fa;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #e1e4e8;
        }

        .placeholder {
            color: #999;
            text-align: center;
        }

        .blur-anim {
            filter: blur(4px);
            opacity: 0.7;
        }

    </style>
</head>
<body>

<h1>⚖️ 智能加权抽题系统</h1>

<div class="stats-bar" id="statsBar" style="visibility: hidden;">
    <span>总题数: <b id="totalCount">0</b></span>
    <span>已抽过: <b id="viewedCount">0</b></span>
    <span>未读: <b id="newCount">0</b></span>
</div>

<div class="controls">
    <input type="file" id="fileInput" accept=".md,.txt"/>

    <a href="./questions.md" download="questions.md" style="text-decoration:none;">
        <button class="btn-download">📥 下载当前题库</button>
    </a>

    <button id="drawBtn" disabled>开始抽取</button>
    <button id="resetBtn" class="btn-reset" disabled>重置概率</button>
</div>

<div class="question-container" id="displayArea">
    <div class="placeholder">
        <h3>👋 请上传包含 "##" 分隔题目的 Markdown 文件</h3>
        <p>系统会自动降低“已抽中”题目的出现概率</p>
    </div>
</div>

<script>
    // 数据结构： { content: string, originalIndex: int, timesDrawn: int }
    let questionData = [];
    let isRolling = false;
    let animationInterval = null;
    let lastDrawnIndex = -1;

    const fileInput = document.getElementById('fileInput');
    const drawBtn = document.getElementById('drawBtn');
    const resetBtn = document.getElementById('resetBtn');
    const displayArea = document.getElementById('displayArea');
    const statsBar = document.getElementById('statsBar');

    // 统计元素
    const elTotal = document.getElementById('totalCount');
    const elViewed = document.getElementById('viewedCount');
    const elNew = document.getElementById('newCount');

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => parseQuestions(e.target.result);
        reader.readAsText(file);
    });

    function parseQuestions(text) {
        const rawQuestions = text.split(/^# /gm);
        // 转换为对象数组，初始化被抽次数(timesDrawn)为0
        questionData = rawQuestions
            .filter(q => q.trim().length > 0)
            .map((q, index) => ({
                content: "# " + q, // 补回标题符
                originalIndex: index + 1,
                timesDrawn: 0
            }));

        if (questionData.length > 0) {
            updateStats();
            drawBtn.disabled = false;
            resetBtn.disabled = false;
            statsBar.style.visibility = 'visible';
            displayArea.innerHTML = `<div class="placeholder" style="color:#28a745">✅ 已加载 ${questionData.length} 道题目，准备就绪</div>`;
        }
    }

    function updateStats() {
        const total = questionData.length;
        const viewed = questionData.filter(q => q.timesDrawn > 0).length;

        elTotal.textContent = total;
        elViewed.textContent = viewed;
        elNew.textContent = total - viewed;
    }

    // --- 核心算法：加权随机 ---
    function getWeightedRandomIndex() {
        // 算法：未看过的题目权重为 10，看过的题目权重为 1
        // 想要更狠一点？看过的权重设为 0.1
        const UNSEEN_WEIGHT = 10;
        const SEEN_WEIGHT = 1;

        let totalWeight = 0;
        // 1. 计算总权重
        const weights = questionData.map(q => {
            const w = (q.timesDrawn === 0) ? UNSEEN_WEIGHT : SEEN_WEIGHT;
            totalWeight += w;
            return w;
        });

        // 2. 在 0 到 totalWeight 之间取一个随机数
        let randomNum = Math.random() * totalWeight;

        // 3. 找出落在哪个区间
        for (let i = 0; i < weights.length; i++) {
            if (randomNum < weights[i]) {
                return i;
            }
            randomNum -= weights[i];
        }
        return 0; // fallback
    }

    drawBtn.addEventListener('click', () => {
        if (questionData.length === 0) return;
        if (isRolling) stopRolling();
        else startRolling();
    });

    resetBtn.addEventListener('click', () => {
        if (!confirm('确定要重置所有题目的出现概率吗？')) return;
        questionData.forEach(q => q.timesDrawn = 0);
        updateStats();
        alert('概率已重置，所有题目机会均等！');
    });

    function startRolling() {
        isRolling = true;
        drawBtn.textContent = "停止";
        drawBtn.style.backgroundColor = "#e74c3c";
        displayArea.classList.add('blur-anim');

        // 动画只需纯随机，营造视觉效果
        animationInterval = setInterval(() => {
            const idx = Math.floor(Math.random() * questionData.length);
            displayArea.innerHTML = `<div style="text-align:center; opacity:0.5; padding-top:100px;">
                    题目 #${questionData[idx].originalIndex}<br>
                    正在抽取...
                </div>`;
        }, 80);
    }

    function stopRolling() {
        isRolling = false;
        clearInterval(animationInterval);
        drawBtn.textContent = "抽取下一题";
        drawBtn.style.backgroundColor = "";
        displayArea.classList.remove('blur-anim');

        // --- 使用加权算法选择 ---
        const finalIndex = getWeightedRandomIndex();
        const selectedQ = questionData[finalIndex];

        // 增加该题被抽次数
        selectedQ.timesDrawn++;
        updateStats();

        // 渲染结果
        renderQuestion(selectedQ);
    }

    function renderQuestion(q) {
        const htmlContent = marked.parse(q.content);

        // 判断显示的标签
        let statusBadge = '';
        if (q.timesDrawn === 1) {
            statusBadge = `<span class="tag tag-new">✨ 首次抽中</span>`;
        } else {
            statusBadge = `<span class="tag tag-count">第 ${q.timesDrawn} 次复习</span>`;
        }

        displayArea.innerHTML = `
                <div class="header-tags">
                    <span class="tag tag-id">#${q.originalIndex}</span>
                    ${statusBadge}
                </div>
                <div class="question-content markdown-body">
                    ${htmlContent}
                </div>
            `;
        // 调整对齐方式，防止题目太短居中很难看
        displayArea.style.justifyContent = 'flex-start';
    }
</script>
</body>
</html>
