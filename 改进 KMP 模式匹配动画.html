<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>KMP 匹配动画：T="abaabaabaabaaabc"，S="aaabc"</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f4f6fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h2 {
            margin: 0 0 6px;
        }

        .sub {
            color: #666;
            margin-bottom: 16px;
        }

        .panel {
            background: #fff;
            border-radius: 10px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            align-items: center;
            height: 46px;
        }

        .label {
            width: 70px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .track {
            position: relative;
            height: 46px;
            flex: 1;
        }

        .cells {
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            transition: left .45s ease;
        }

        .cell {
            width: 40px;
            height: 40px;
            margin-right: 4px;
            border: 2px solid #ccd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-family: Consolas, monospace;
            background: #fff;
            transition: all .25s;
            box-sizing: border-box;
        }

        .idx {
            border: none;
            background: none;
            color: #999;
            font-size: 13px;
            height: 20px;
        }

        .eq {
            background: #c8f7c5;
            border-color: #2e9e3a;
            transform: scale(1.12);
        }

        .neq {
            background: #ffd0d0;
            border-color: #d33;
            transform: scale(1.12);
        }

        .done {
            background: #c8f7c5;
            border-color: #2e9e3a;
        }

        .passed {
            background: #eef0f4;
            color: #aaa;
        }

        .ptr {
            color: #d33;
            font-weight: bold;
            font-size: 13px;
        }

        .controls button, .controls select {
            font-size: 15px;
            padding: 6px 14px;
            margin-right: 6px;
            border-radius: 6px;
            border: 1px solid #99a;
            background: #fff;
            cursor: pointer;
        }

        .controls button:hover {
            background: #e8ecf5;
        }

        .stat {
            font-size: 18px;
            margin: 10px 0;
        }

        .stat b {
            color: #d33;
            font-size: 26px;
        }

        .msg {
            font-size: 16px;
            min-height: 24px;
            padding: 8px 12px;
            background: #fff8e1;
            border-left: 4px solid #f0b400;
            border-radius: 4px;
        }

        table {
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid #ccd;
            width: 44px;
            height: 30px;
            text-align: center;
            font-family: Consolas, monospace;
        }

        th {
            background: #eef1f8;
        }

        td.hl {
            background: #ffe58a;
            font-weight: bold;
        }

        #log {
            max-height: 220px;
            overflow: auto;
            font-family: Consolas, monospace;
            font-size: 14px;
            line-height: 1.7;
        }

        #log div.cur {
            background: #ffe58a;
        }

        .flex {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .flex > .panel {
            flex: 1;
            min-width: 320px;
        }
    </style>
</head>
<body>
<h2>改进 KMP 模式匹配动画</h2>
<div class="sub">主串 T = "abaabaabaabaaabc"，模式串 S = "aaabc"（下标从 1 开始）</div>
<div class="panel controls">
    模式：
    <select id="mode">
        <option value="nextval">nextval（本题）</option>
        <option value="next">普通 next（对比）</option>
    </select>
    <button id="play">▶ 播放</button>
    <button id="prev">⏮ 上一步</button>
    <button id="nextBtn">⏭ 下一步</button>
    <button id="reset">↺ 重置</button>
    速度：
    <select id="speed">
        <option value="1600">慢</option>
        <option value="1000" selected>中</option>
        <option value="500">快</option>
    </select>
</div>
<div class="panel">
    <div class="row">
        <div class="label"></div>
        <div class="track">
            <div class="cells" id="tIdx"></div>
        </div>
    </div>
    <div class="row">
        <div class="label">主串 T</div>
        <div class="track">
            <div class="cells" id="tRow"></div>
        </div>
    </div>
    <div class="row">
        <div class="label">模式 S</div>
        <div class="track">
            <div class="cells" id="sRow"></div>
        </div>
    </div>
    <div class="row">
        <div class="label"></div>
        <div class="track">
            <div class="cells" id="sIdx"></div>
        </div>
    </div>
    <div class="stat">i = <span id="vi">1</span>，j = <span id="vj">1</span>　｜　累计比较次数：<b id="cnt">0</b></div>
    <div class="msg" id="msg">点击「播放」或「下一步」开始</div>
</div>
<div class="flex">
    <div class="panel">
        <h3 style="margin-top:0">失配跳转表</h3>
        <table>
            <tr>
                <th>j</th>
                <th>1</th>
                <th>2</th>
                <th>3</th>
                <th>4</th>
                <th>5</th>
            </tr>
            <tr>
                <th>S[j]</th>
                <td>a</td>
                <td>a</td>
                <td>a</td>
                <td>b</td>
                <td>c</td>
            </tr>
            <tr>
                <th>next</th>
                <td id="n1">0</td>
                <td id="n2">1</td>
                <td id="n3">2</td>
                <td id="n4">3</td>
                <td id="n5">1</td>
            </tr>
            <tr>
                <th>nextval</th>
                <td id="v1">0</td>
                <td id="v2">0</td>
                <td id="v3">0</td>
                <td id="v4">3</td>
                <td id="v5">1</td>
            </tr>
        </table>
        <p style="font-size:14px;color:#555">失配时令 j = 表中的值；j = 0 表示主串 i 后移、j 置 1，<b>这一步不算比较</b>。
        </p>
    </div>
    <div class="panel">
        <h3 style="margin-top:0">过程日志</h3>
        <div id="log"></div>
    </div>
</div>
<script>
    const T = "abaabaabaabaaabc", S = "aaabc";
    const n = T.length, m = S.length;
    const TABLE = {nextval: [null, 0, 0, 0, 3, 1], next: [null, 0, 1, 2, 3, 1]};
    const W = 44; // 单元格宽度 + 间距
    // ---------- 生成所有步骤 ----------
    function simulate(mode) {
        const nx = TABLE[mode], steps = [];
        let i = 1, j = 1, cnt = 0;
        steps.push({type: 'init', i, j, cnt, offset: 0, msg: '开始：i = 1，j = 1'});
        while (i <= n && j <= m) {
            if (j === 0) {
                steps.push({
                    type: 'shift', i: i + 1, j: 1, cnt, offset: i,
                    msg: `j = 0 → 主串指针后移：i = ${i + 1}，j = 1（不计比较）`
                });
                i++;
                j = 1;
                continue;
            }
            cnt++;
            const eq = T[i - 1] === S[j - 1];
            if (eq) {
                steps.push({
                    type: 'cmp', eq, i, j, cnt, offset: i - j,
                    msg: `第 ${cnt} 次比较：T[${i}]='${T[i - 1]}' 与 S[${j}]='${S[j - 1]}' 相等 ✔ → i、j 后移`
                });
                i++;
                j++;
            } else {
                const nj = nx[j];
                steps.push({
                    type: 'cmp', eq, i, j, cnt, offset: i - j, jump: j,
                    msg: `第 ${cnt} 次比较：T[${i}]='${T[i - 1]}' 与 S[${j}]='${S[j - 1]}' 失配 ✘ → j = ${mode}[${j}] = ${nj}`
                });
                j = nj;
            }
        }
        if (j > m) {
            steps.push({
                type: 'done', i: i - m, j: m, cnt, offset: i - 1 - m,
                msg: `🎉 匹配成功！位置 ${i - m}，共比较 ${cnt} 次`
            });
        }
        return steps;
    }

    // ---------- 渲染 ----------
    const tRow = document.getElementById('tRow'), sRow = document.getElementById('sRow');
    const tIdx = document.getElementById('tIdx'), sIdx = document.getElementById('sIdx');

    function build() {
        tRow.innerHTML = tIdx.innerHTML = sRow.innerHTML = sIdx.innerHTML = '';
        for (let k = 0; k < n; k++) {
            tRow.innerHTML += `<div class="cell" id="t${k + 1}">${T[k]}</div>`;
            tIdx.innerHTML += `<div class="cell idx" id="ti${k + 1}">${k + 1}</div>`;
        }
        for (let k = 0; k < m; k++) {
            sRow.innerHTML += `<div class="cell" id="s${k + 1}">${S[k]}</div>`;
            sIdx.innerHTML += `<div class="cell idx" id="si${k + 1}">${k + 1}</div>`;
        }
    }

    let mode = 'nextval', steps = simulate(mode), cur = 0, timer = null;

    function render() {
        const st = steps[cur];
        // 清除样式
        for (let k = 1; k <= n; k++) {
            const c = document.getElementById('t' + k);
            c.className = 'cell';
            if (k < st.i && st.type !== 'done') c.classList.add('passed');
            document.getElementById('ti' + k).className = 'cell idx';
        }
        for (let k = 1; k <= m; k++) {
            document.getElementById('s' + k).className = 'cell';
            document.getElementById('si' + k).className = 'cell idx';
        }
        // 模式串平移
        sRow.style.left = sIdx.style.left = (st.offset * W) + 'px';
        if (st.type === 'cmp') {
            const cls = st.eq ? 'eq' : 'neq';
            document.getElementById('t' + st.i).className = 'cell ' + cls;
            document.getElementById('s' + st.j).className = 'cell ' + cls;
            document.getElementById('ti' + st.i).className = 'cell idx ptr';
            document.getElementById('si' + st.j).className = 'cell idx ptr';
        } else if (st.type === 'done') {
            for (let k = 1; k <= m; k++) {
                document.getElementById('s' + k).className = 'cell done';
                document.getElementById('t' + (st.i + k - 1)).className = 'cell done';
            }
        } else if (st.i <= n) {
            document.getElementById('ti' + st.i).className = 'cell idx ptr';
            document.getElementById('si1').className = 'cell idx ptr';
        }
        document.getElementById('vi').textContent = st.i;
        document.getElementById('vj').textContent = st.j;
        document.getElementById('cnt').textContent = st.cnt;
        document.getElementById('msg').textContent = st.msg;
        // 高亮表格
        for (let k = 1; k <= 5; k++) {
            document.getElementById('n' + k).className = '';
            document.getElementById('v' + k).className = '';
        }
        if (st.jump) document.getElementById((mode === 'next' ? 'n' : 'v') + st.jump).className = 'hl';
        // 日志
        const log = document.getElementById('log');
        log.innerHTML = steps.slice(0, cur + 1).map((s, k) =>
            `<div class="${k === cur ? 'cur' : ''}">${s.msg}</div>`).join('');
        log.scrollTop = log.scrollHeight;
    }

    function step(d) {
        cur = Math.max(0, Math.min(steps.length - 1, cur + d));
        render();
        if (cur === steps.length - 1) stop();
    }

    function stop() {
        clearInterval(timer);
        timer = null;
        document.getElementById('play').textContent = '▶ 播放';
    }

    function play() {
        if (timer) {
            stop();
            return;
        }
        if (cur === steps.length - 1) cur = 0;
        document.getElementById('play').textContent = '⏸ 暂停';
        timer = setInterval(() => step(1), +document.getElementById('speed').value);
    }

    document.getElementById('play').onclick = play;
    document.getElementById('nextBtn').onclick = () => {
        stop();
        step(1);
    };
    document.getElementById('prev').onclick = () => {
        stop();
        step(-1);
    };
    document.getElementById('reset').onclick = () => {
        stop();
        cur = 0;
        render();
    };
    document.getElementById('speed').onchange = () => {
        if (timer) {
            stop();
            play();
        }
    };
    document.getElementById('mode').onchange = e => {
        stop();
        mode = e.target.value;
        steps = simulate(mode);
        cur = 0;
        render();
    };
    build();
    render();
</script>
</body>
</html>
