<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html 收集</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #f0f2f5; /* 柔和的灰色背景 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            gap: 20px; /* 按钮之间的间距 */
            flex-wrap: wrap; /* 小屏幕自动换行 */
            justify-content: center;
        }

        /* 链接按钮样式 */
        .link-card {
            display: block;
            text-decoration: none;
            background: white;
            color: #4a4a4a;
            padding: 20px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            min-width: 150px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* 鼠标悬停效果 */
        .link-card:hover {
            transform: translateY(-5px); /* 向上浮动 */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            color: #007bff; /* 文字变蓝 */
        }

        /* 分别给TCP和相机加一点不同的左侧边框颜色 */
        .link-card:nth-child(1) {
            border-left: 5px solid #ff6b6b;
        }

        /* 复古相机 - 红色 */
        .link-card:nth-child(2) {
            border-left: 5px solid #4ecdc4;
        }

        /* TCP - 青色 */
        .link-card:nth-child(3) {
            border-left: 5px solid #0b7e74;
        }

        /* TCP - 青色 */
        .link-card:nth-child(4) {
            border-left: 5px solid #3435c5;
        }

        /* TCP - 青色 */
        .link-card:nth-child(5) {
            border-left: 5px solid #768832;
        }

        .link-card:nth-child(6) {
            border-left: 5px solid rgba(147, 15, 141, 0.8);
        }
    </style>
</head>
<body>

<h1>我的 HTML 收集</h1>

<div class="container">
    <a href="复古相机.html" class="link-card">📷 复古相机</a>
    <a href="TCP.html" class="link-card">🔌 模拟 TCP 连接</a>
    <a href="TCPCongestionControlSimulator.html" class="link-card"> TCP 拥塞控制模拟</a>
    <a href="lottery.html" class="link-card"> 🎲Markdown 题目抽奖系统</a>
    <a href="newyear.html" class="link-card">2026 新年盛典 - 高级质感版</a>

    <!--    <a href="软件工程-手机.html" class="link-card">软件工程导论-手机</a>-->
    <a href="heap.html" class="link-card">大根堆/小根堆的建立</a>
    <a href="BFS.html" class="link-card">BFS</a>
    <a href="DFS.html" class="link-card">DFS</a>
</div>

</body>
</html>
