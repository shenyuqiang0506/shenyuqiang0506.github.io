<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11408 考研真题聚合系统</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 核心：通过 script 标签直接引入本地庞大题库，彻底绕过跨域限制 -->
    <script src="./data.js"></script>
    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #888888;
            --border-color: #e5e5ea;
            --gap: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .layout {
            display: flex;
            min-height: 100vh;
            padding: var(--gap);
            gap: var(--gap);
            transition: all 0.3s;
        }

        .sidebar {
            width: 280px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            height: calc(100vh - 32px);
            position: sticky;
            top: var(--gap);
            overflow-y: auto;
        }

        .filter-group {
            margin-bottom: 24px;
        }

        .filter-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-light);
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--gap);
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .question-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .difficulty-tag {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .diff-1 {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .diff-2 {
            background: #fff3e0;
            color: #ef6c00;
        }

        .diff-3 {
            background: #ffebee;
            color: #c62828;
        }

        .card-content {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-light);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #ccc;
            transition: color 0.2s;
        }

        .star-btn.active {
            color: #fbc02d;
        }

        .fab-generate {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-color);
            color: white;
            padding: 16px 24px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3);
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .fab-generate:hover {
            transform: scale(1.05);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            transition: opacity 0.3s;
        }

        .loading-state {
            text-align: center;
            padding: 60px;
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .fab-generate {
                bottom: 20px;
                right: 20px;
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div id="app" class="layout">
    <aside class="sidebar">
        <h2 style="margin-bottom: 24px; font-size: 18px;">408 真题题库</h2>

        <div class="filter-group">
            <div class="filter-title">科目模块</div>
            <div class="filter-options">
                <button v-for="sub in filterConfig.subjects" :key="sub"
                        :class="['filter-btn', { active: currentFilters.subject === sub }]"
                        @click="setFilter('subject', sub)">
                    {{ sub }}
                </button>
            </div>
        </div>

        <div class="filter-group" v-if="availableYears.length > 0">
            <div class="filter-title">年份区间</div>
            <div class="filter-options">
                <button v-for="year in availableYears" :key="year"
                        :class="['filter-btn', { active: currentFilters.years.includes(year) }]"
                        @click="toggleFilterArray('years', year)">
                    {{ year }}
                </button>
            </div>
        </div>

        <div class="filter-group" v-if="availableTags.length > 0">
            <div class="filter-title">知识点标签</div>
            <div class="filter-options">
                <button v-for="tag in availableTags" :key="tag"
                        :class="['filter-btn', { active: currentFilters.tags.includes(tag) }]"
                        @click="toggleFilterArray('tags', tag)">
                    {{ tag }}
                </button>
            </div>
        </div>

        <div class="filter-group">
            <div class="filter-title">难度系数</div>
            <div class="filter-options">
                <button v-for="level in [1, 2, 3]" :key="level"
                        :class="['filter-btn', { active: currentFilters.difficulty === level }]"
                        @click="setFilter('difficulty', level)">
                    {{ level === 1 ? '基础' : level === 2 ? '强化' : '冲刺' }}
                </button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <div v-if="!loading">共解析并找到 <strong>{{ filteredQuestions.length }}</strong> 道真题</div>
            <div v-else>正在初始化内嵌题库...</div>
            <div>
                <button class="filter-btn" @click="resetFilters" style="border: none; background: #f0f0f0;">清空筛选
                </button>
            </div>
        </div>

        <div v-if="loading" class="loading-state">
            🔄 正在加载并映射全局数据...
        </div>
        <div v-else class="card-grid">
            <div class="question-card" v-for="q in filteredQuestions" :key="q.id" @click="expandQuestion(q)">
                <div class="card-header">
                        <span :class="['difficulty-tag', `diff-${q.difficulty}`]">
                            {{ q.difficulty === 1 ? '基础' : q.difficulty === 2 ? '强化' : '冲刺' }}
                        </span>
                    <button :class="['star-btn', { active: favorites.includes(q.id) }]"
                            @click.stop="toggleFavorite(q.id)">
                        ★
                    </button>
                </div>
                <div class="card-content">{{ q.content }}</div>
                <div class="card-footer">
                    <span>{{ q.subject }} · {{ q.year }}</span>
                    <span>{{ q.tag }}</span>
                </div>
            </div>
        </div>

        <div v-if="!loading && filteredQuestions.length === 0" style="text-align: center; padding: 40px; color: #888;">
            未找到匹配的题目，请调整筛选条件。
        </div>
    </main>

    <button class="fab-generate" @click="triggerSmartGeneration">
        ✨ 智能组卷
    </button>

    <div class="toast" v-if="toastMsg">{{ toastMsg }}</div>
</div>

<script>
    const {createApp, ref, computed, watch, onMounted} = Vue;

    createApp({
        setup() {
            const rawQuestions = ref([]);
            const loading = ref(true);

            const filterConfig = {
                subjects: ['全部', '数据结构', '组成原理', '操作系统', '计算机网络']
            };

            const currentFilters = ref({
                subject: '全部',
                years: [],
                tags: [],
                difficulty: null
            });

            const favorites = ref([]);
            const toastMsg = ref('');

            const parseRealData = (pages) => {
                const parsed = [];
                pages.forEach((page, index) => {
                    let subject = "";
                    let year = "未知";
                    let content = "";
                    let qType = "单项选择题";

                    page.forEach(item => {
                        if (item.type === 'page_header' && item.content?.page_header_content?.length > 0) {
                            const text = item.content.page_header_content[0].content || '';
                            if (text.includes('数据结构')) subject = '数据结构';
                            else if (text.includes('组成原理')) subject = '组成原理';
                            else if (text.includes('操作系统')) subject = '操作系统';
                            else if (text.includes('计算机网络')) subject = '计算机网络';

                            const yearMatch = text.match(/(20\d{2})/);
                            if (yearMatch) year = yearMatch[1];
                            if (text.includes('综合应用题')) qType = '综合应用题';
                        } else if (['paragraph', 'title'].includes(item.type)) {
                            const texts = item.content?.paragraph_content || item.content?.title_content || [];
                            texts.forEach(p => {
                                content += (p.content || p.math_content || '') + " ";
                            });
                            content += "\n";
                        } else if (item.type === 'code' && item.content?.code_content) {
                            content += "\n" + item.content.code_content[0].content + "\n\n";
                        }
                    });

                    if (subject && content.trim()) {
                        let tag = '综合';
                        if (content.includes('复杂度')) tag = '时间复杂度';
                        else if (content.includes('栈') || content.includes('括号')) tag = '栈与队列';
                        else if (content.includes('二叉树') || content.includes('森林') || content.includes('哈夫曼')) tag = '树与二叉树';
                        else if (content.includes('图') || content.includes('拓扑') || content.includes('度')) tag = '图论';
                        else if (content.includes('排序')) tag = '排序算法';
                        else if (content.includes('散列') || content.includes('查找')) tag = '查找算法';
                        else if (content.includes('TCP') || content.includes('UDP')) tag = '传输层';
                        else if (content.includes('页式') || content.includes('内存') || content.includes('页面')) tag = '内存管理';
                        else if (content.includes('中断') || content.includes('DMA')) tag = 'I/O 系统';
                        else if (content.includes('Cache') || content.includes('寻址') || content.includes('地址')) tag = '存储系统';
                        else if (content.includes('进程') || content.includes('线程') || content.includes('调度')) tag = '进程管理';
                        else if (content.includes('指令')) tag = '指令系统';

                        parsed.push({
                            id: index,
                            subject: subject,
                            year: year,
                            tag: tag,
                            difficulty: qType === '综合应用题' ? 3 : (content.length > 150 ? 2 : 1),
                            content: content.trim()
                        });
                    }
                });
                return parsed;
            };

            onMounted(() => {
                const localFavs = localStorage.getItem('11408_favorites');
                if (localFavs) favorites.value = JSON.parse(localFavs);

                // 检查全局变量 fullExamData 是否存在
                if (typeof fullExamData !== 'undefined') {
                    rawQuestions.value = parseRealData(fullExamData);
                } else {
                    showToast('未检测到全局题库变量，请检查 data.js 引入情况');
                }
                loading.value = false;
            });

            const availableYears = computed(() => {
                const years = rawQuestions.value.map(q => q.year).filter(y => y !== '未知');
                return [...new Set(years)].sort((a, b) => b - a);
            });

            const availableTags = computed(() => {
                let filtered = rawQuestions.value;
                if (currentFilters.value.subject !== '全部') {
                    filtered = filtered.filter(q => q.subject === currentFilters.value.subject);
                }
                if (currentFilters.value.years.length > 0) {
                    filtered = filtered.filter(q => currentFilters.value.years.includes(q.year));
                }
                return [...new Set(filtered.map(q => q.tag))];
            });

            const filteredQuestions = computed(() => {
                return rawQuestions.value.filter(q => {
                    const matchSubject = currentFilters.value.subject === '全部' || q.subject === currentFilters.value.subject;
                    const matchYears = currentFilters.value.years.length === 0 || currentFilters.value.years.includes(q.year);
                    const matchTags = currentFilters.value.tags.length === 0 || currentFilters.value.tags.includes(q.tag);
                    const matchDifficulty = !currentFilters.value.difficulty || q.difficulty === currentFilters.value.difficulty;
                    return matchSubject && matchYears && matchTags && matchDifficulty;
                });
            });

            watch([() => currentFilters.value.subject, () => currentFilters.value.years], () => {
                currentFilters.value.tags = currentFilters.value.tags.filter(tag => availableTags.value.includes(tag));
            });

            const setFilter = (type, val) => {
                if (currentFilters.value[type] === val && type !== 'subject') {
                    currentFilters.value[type] = null;
                } else {
                    currentFilters.value[type] = val;
                }
            };

            const toggleFilterArray = (type, val) => {
                const idx = currentFilters.value[type].indexOf(val);
                if (idx > -1) currentFilters.value[type].splice(idx, 1);
                else currentFilters.value[type].push(val);
            };

            const resetFilters = () => {
                currentFilters.value = {subject: '全部', years: [], tags: [], difficulty: null};
                showToast('已清空筛选条件');
            };

            const toggleFavorite = (id) => {
                const idx = favorites.value.indexOf(id);
                if (idx > -1) {
                    favorites.value.splice(idx, 1);
                    showToast('已取消收藏');
                } else {
                    favorites.value.push(id);
                    showToast('⭐ 收藏成功');
                }
                localStorage.setItem('11408_favorites', JSON.stringify(favorites.value));
            };

            const expandQuestion = (q) => {
                console.log('查看大题/详细内容:', q.id);
            };

            const triggerSmartGeneration = () => {
                if (filteredQuestions.value.length < 5) {
                    showToast('当前题量不足 (需≥5题)，请放宽筛选条件');
                    return;
                }
                showToast('正在根据比例及难度生成 408 专属试卷...');
            };

            const showToast = (msg) => {
                toastMsg.value = msg;
                setTimeout(() => toastMsg.value = '', 2000);
            };

            return {
                rawQuestions, loading, filterConfig, currentFilters,
                availableYears, availableTags, filteredQuestions,
                favorites, toastMsg,
                setFilter, toggleFilterArray, resetFilters, toggleFavorite, expandQuestion, triggerSmartGeneration
            };
        }
    }).mount('#app');
</script>
</body>
</html>
