<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>考研英语大作文 · 交互拼装模板</title>
    <style>
        :root {
            --ink: #1b2430;
            --ink2: #3d4a58;
            --muted: #7b8794;
            --paper: #fbf9f4;
            --card: #ffffff;
            --line: #e2dbcd;
            --line2: #efe9dc;
            --accent: #b5432f;
            --accent-soft: #fbeee8;
            --blue: #1d4e6f;
            --blue-soft: #eaf1f6;
            --hl: #fdf1cf;
            --hl-line: #d9a94a;
            --shadow: 0 8px 28px rgba(27, 36, 48, .10);
            --serif: Georgia, "Times New Roman", "Songti SC", serif;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            padding: 0
        }

        body {
            font-family: var(--sans);
            background: var(--paper);
            color: var(--ink);
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font-family: inherit;
            cursor: pointer
        }

        select, input {
            font-family: inherit
        }

        /* ---------- header ---------- */
        .top {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(251, 249, 244, .96);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--line)
        }

        .top-in {
            max-width: 1420px;
            margin: 0 auto;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-right: auto
        }

        .brand h1 {
            font-size: 17px;
            margin: 0;
            letter-spacing: .5px;
            font-weight: 700
        }

        .brand h1 b {
            color: var(--accent)
        }

        .brand .sub {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: .4px
        }

        .tools {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .tools select {
            height: 31px;
            max-width: 270px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            padding: 0 8px;
            font-size: 12.5px;
            color: var(--ink)
        }

        .btn {
            height: 31px;
            padding: 0 11px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 6px;
            font-size: 12.5px;
            color: var(--ink2);
            transition: .15s
        }

        .btn:hover {
            border-color: var(--muted);
            background: #fffdf8
        }

        .btn.primary {
            background: var(--ink);
            color: #fdfbf5;
            border-color: var(--ink)
        }

        .btn.primary:hover {
            background: #000
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        /* ---------- scenario nav ---------- */
        .scen {
            max-width: 1420px;
            margin: 0 auto;
            padding: 9px 18px 0;
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .scen button {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12.5px;
            letter-spacing: .2px;
            transition: .15s
        }

        .scen button small {
            color: var(--muted);
            margin-left: 5px;
            font-size: 10.5px
        }

        .scen button:hover {
            border-color: var(--blue);
            color: var(--blue)
        }

        .scen button.on {
            background: var(--ink);
            border-color: var(--ink);
            color: #fdfbf5
        }

        .scen button.on small {
            color: #c9b79e
        }

        /* ---------- option bar ---------- */
        .opts {
            max-width: 1420px;
            margin: 0 auto;
            padding: 8px 18px 10px;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--line2)
        }

        .opts label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--ink2);
            cursor: pointer;
            user-select: none
        }

        .opts input[type=checkbox] {
            accent-color: var(--accent);
            width: 13px;
            height: 13px
        }

        .opts .connlab select {
            height: 26px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: #fff;
            font-size: 11.5px;
            color: var(--ink2);
            padding: 0 6px;
            max-width: 250px
        }

        .opts .count {
            margin-left: auto;
            font-size: 11.5px;
            color: var(--muted);
            font-variant-numeric: tabular-nums
        }

        /* ---------- layout ---------- */
        main {
            max-width: 1420px;
            margin: 0 auto;
            padding: 14px 18px 60px;
            display: grid;
            grid-template-columns:minmax(0, 1fr) minmax(380px, 46%);
            gap: 18px;
            align-items: start
        }

        @media (max-width: 1080px) {
            main {
                grid-template-columns:1fr
            }

            .preview {
                position: static !important
            }
        }

        /* ---------- editor ---------- */
        .editor {
            min-width: 0
        }

        .part {
            margin-bottom: 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            overflow: hidden
        }

        .part-h {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 13px;
            background: #fffdf8;
            border-bottom: 1px solid var(--line2)
        }

        .part-h .idx {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--ink);
            color: #fff;
            font-size: 11px;
            display: grid;
            place-items: center;
            flex: 0 0 auto
        }

        .part-h h2 {
            font-size: 13.5px;
            margin: 0;
            letter-spacing: .3px
        }

        .part-h span:not(.idx) {
            font-size: 11px;
            color: var(--muted);
            margin-left: auto
        }

        .step {
            padding: 10px 13px;
            border-bottom: 1px dashed var(--line2);
            transition: background .15s
        }

        .step:last-child {
            border-bottom: 0
        }

        .step:hover {
            background: #fffdf7
        }

        .step-h {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px
        }

        .step-h .lab {
            font-size: 11.5px;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: .4px;
            flex: 0 0 auto
        }

        .step-h select {
            flex: 1;
            min-width: 0;
            height: 26px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: #fff;
            font-size: 11.5px;
            color: var(--ink2);
            padding: 0 6px
        }

        .step-h .tip {
            font-size: 10.5px;
            color: var(--muted);
            flex: 0 0 auto
        }

        .sent {
            font-family: var(--serif);
            font-size: 14.5px;
            line-height: 1.75;
            color: var(--ink)
        }

        .sent .lit {
            white-space: pre-wrap
        }

        .cn-line {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 2px;
            line-height: 1.6
        }

        /* slot chip */
        .slot {
            display: inline;
            border: 0;
            background: transparent;
            padding: 1px 3px;
            margin: 0 1px;
            font: inherit;
            color: var(--accent);
            border-bottom: 1px dashed var(--accent);
            border-radius: 3px 3px 0 0;
            transition: .12s;
            line-height: inherit
        }

        .slot:hover {
            background: var(--accent-soft)
        }

        .slot.filled {
            background: var(--hl);
            color: #6b4a10;
            border-bottom: 1px solid var(--hl-line);
            font-weight: 600
        }

        .slot.filled:hover {
            background: #fbe4a8
        }

        /* ---------- preview ---------- */
        .preview {
            position: sticky;
            top: 104px
        }

        .pv-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px
        }

        .pv-bar h3 {
            font-size: 12.5px;
            margin: 0;
            letter-spacing: .5px;
            color: var(--ink2)
        }

        .pv-bar .wc {
            margin-left: auto;
            font-size: 11px;
            color: var(--muted);
            font-variant-numeric: tabular-nums
        }

        .paper {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 18px 20px 22px;
            box-shadow: var(--shadow);
            max-height: calc(100vh - 190px);
            overflow: auto
        }

        .para {
            margin-bottom: 14px
        }

        .para:last-child {
            margin-bottom: 0
        }

        .para .pnum {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 1px;
            margin-bottom: 3px;
            text-transform: uppercase
        }

        .para .en {
            font-family: var(--serif);
            font-size: 14.5px;
            line-height: 1.85;
            text-align: justify;
            color: #141b24
        }

        .para .en p {
            margin: 0 0 5px
        }

        .para .zh {
            font-size: 11.5px;
            line-height: 1.75;
            color: #8a7f6d;
            border-left: 2px solid var(--line);
            padding-left: 8px;
            margin-top: 6px
        }

        .para .zh p {
            margin: 0 0 3px
        }

        .para .en .slot {
            font-family: var(--serif)
        }

        .empty {
            color: var(--muted);
            font-size: 12px;
            padding: 20px 0;
            text-align: center
        }

        /* ---------- popover ---------- */
        .pop {
            position: fixed;
            z-index: 90;
            width: 340px;
            max-width: calc(100vw - 24px);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 16px 44px rgba(27, 36, 48, .18);
            overflow: hidden
        }

        .pop-h {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 11px;
            border-bottom: 1px solid var(--line2);
            background: #fffdf8
        }

        .pop-h b {
            font-size: 12.5px
        }

        .pop-h .x {
            margin-left: auto;
            border: 0;
            background: transparent;
            font-size: 15px;
            color: var(--muted);
            line-height: 1;
            padding: 2px 4px
        }

        .pop-h .x:hover {
            color: var(--accent)
        }

        .pop-in {
            display: flex;
            gap: 6px;
            padding: 9px 11px;
            border-bottom: 1px solid var(--line2)
        }

        .pop-in input {
            flex: 1;
            min-width: 0;
            height: 28px;
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 0 7px;
            font-size: 12.5px
        }

        .pop-in input:focus {
            outline: 2px solid var(--blue-soft);
            border-color: var(--blue)
        }

        .pop-in button {
            height: 28px;
            padding: 0 10px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: #fff;
            border-radius: 5px;
            font-size: 12px
        }

        .pop-list {
            max-height: 280px;
            overflow: auto;
            padding: 4px
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: transparent;
            padding: 7px 8px;
            border-radius: 6px;
            transition: .12s
        }

        .opt:hover {
            background: var(--blue-soft)
        }

        .opt .oe {
            font-family: var(--serif);
            font-size: 12.8px;
            color: var(--ink);
            line-height: 1.45
        }

        .opt .oc {
            font-size: 11px;
            color: var(--ink2);
            margin-top: 1px
        }

        .opt .on {
            font-size: 10.5px;
            color: var(--muted);
            margin-top: 2px;
            line-height: 1.45
        }

        .opt.cur {
            background: var(--hl)
        }

        .pop-f {
            padding: 7px 11px;
            border-top: 1px solid var(--line2);
            display: flex;
            gap: 8px
        }

        .pop-f button {
            font-size: 11.5px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 5px;
            padding: 3px 9px;
            color: var(--ink2)
        }

        .pop-f button:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        /* toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(10px);
            background: var(--ink);
            color: #fff;
            font-size: 12.5px;
            padding: 8px 16px;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 120
        }

        .toast.on {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }

        @media print {
            .top, .scen, .opts, .editor, .pv-bar {
                display: none !important
            }

            main {
                display: block;
                padding: 0
            }

            .preview {
                position: static
            }

            .paper {
                box-shadow: none;
                border: 0;
                max-height: none;
                padding: 0
            }
        }
    </style>
</head>
<body>

<div class="top">
    <div class="top-in">
        <div class="brand">
            <h1>大作文 <b>交互拼装</b></h1>
            <span class="sub">英一 · 英二通用｜点红色方框填词，下拉换句式</span>
        </div>
        <div class="tools">
            <select id="preset" title="载入真题预设"></select>
            <button class="btn" id="undo" title="撤销上一步">撤销</button>
            <button class="btn" id="clear" title="清空全部填写">清空</button>
            <button class="btn primary" id="copy" title="复制英文全文">复制全文</button>
        </div>
    </div>
</div>

<nav class="scen" id="scen"></nav>

<div class="opts">
    <label><input type="checkbox" id="tg-bi" checked> 中英对照</label>
    <label><input type="checkbox" id="tg-concise"> 考场精简</label>
    <label><input type="checkbox" id="tg-three"> 三条原因（英一）</label>
    <label><input type="checkbox" id="tg-hint" checked> 句位提示</label>
    <label class="connlab">原因连接词
        <select id="conn">
            <option value="none">不加（自然衔接）</option>
            <option value="c1">Firstly / Secondly / Thirdly</option>
            <option value="c2">To begin with / What's more / Last but not least</option>
            <option value="c3">To begin with / More importantly / Most importantly</option>
            <option value="c4">For one thing / For another</option>
            <option value="c5">First and foremost / Furthermore / Last but not least</option>
        </select>
    </label>
    <span class="count" id="count"></span>
</div>

<main>
    <section class="editor" id="editor"></section>
    <aside class="preview">
        <div class="pv-bar">
            <h3>成稿预览</h3>
            <button class="btn" id="copy2" style="height:26px;font-size:11.5px">复制</button>
            <span class="wc" id="wc"></span>
        </div>
        <div class="paper" id="preview"></div>
    </aside>
</main>

<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast"></div>

        /* ============================ 句子拼装 ============================ */
        function isPluralValue(v) {
            if (!v) return false;

            if (!s) return false;
            if (/\band\b/.test(s)) return true;
            var head = s;
            var cut = head.search(/\s(?:of|from|in|on|with|among|for|by|to|towards|about)\s/);
            if (cut > -1) head = head.slice(0, cut);
            var w = head.split(" ").filter(Boolean);
            head = w[w.length - 1] || "";
            if (PLURAL_WORDS[head]) return true;
            if (/[a-z]s$/.test(head) && !/(ss|us|is)$/.test(head)) return true;
            return false;
        }

        function dispVal(sid, lang) {

                    }
                }
                /* 本槽没有对应词条时，用全库词典兜底翻译 */
                for (var k in SLOTS) {
                    var os = SLOTS[k].options;
                    if (!os) continue;
                    for (var j = 0; j < os.length; j++) {
                        if (os[j].en === v && os[j].cn) return os[j].cn;
                    }
                }
            }
            return String(v);

            /* 槽位 + 动词 相邻：按槽位单复数改动词 */
            var re = new RegExp("\\u0001[^\\u0002]*\\u0002[^\\u0002]*\\u0002([^\\u0003]*)\\u0003(\\s+)(" + VERB_RE_SRC.join("|") + ")\\b", "g");
            str = str.replace(re, function (m, val, sp, verb) {
                var plural = isPluralValue(val);
                var fixed = plural ? (TO_PLURAL[verb] || verb) : (TO_SING[verb] || verb);
                return m.slice(0, m.length - verb.length) + fixed;

            str = str.replace(re2, function (m, aux, sp, marker, val) {

            var m = /^(\s*)([A-Za-z][A-Za-z'’\-]*)/.exec(s);
            if (!m) return s;

                    if (state.tg.bi && state.tg.hint && v.note) {
                        var note = document.createElement("div");
                        note.className = "cn-line";
                        note.textContent = "用法：" + v.note;
                        row.appendChild(note);
                    }
                    wrap.appendChild(row);

                    /* 预览 */
                    if (!blank) {
                        enP.innerHTML += (idx ? " " : "") + enR.html;
                        zhP.innerHTML += zhR.html;
                        wc += enR.plain.trim().split(/\s+/).filter(Boolean).length;
                    }
                    prevAppend = !!step.append;
                });

                enBox.appendChild(enP);
                if (state.tg.bi) {
                    zhBox.appendChild(zhP);
                }
                pEl.appendChild(enBox);
                if (state.tg.bi) pEl.appendChild(zhBox);
                pv.appendChild(pEl);
                ed.appendChild(wrap);
            });

            var counter = $("#count");
            if (counter) counter.textContent = "已选 " + countSelections() + " 句 · " + wc + " 词";
            var wcEl = $("#wc");
            if (wcEl) wcEl.textContent = wc + " words" + (wc >= 140 && wc <= 200 ? " · 符合英二" : "");

            syncControls();
            saveState();
        }

        function countSelections() {
            var n = 0;
            sectionList().forEach(function (sec) {
                sec.steps.filter(stepVisible).forEach(function (s) {
                    if (pickVariant(s)) n++;
                });
            });
            return n;
        }

        function syncControls() {
            var ps = $("#preset");
            if (ps) ps.value = state.pid || "";
            $("#tg-bi").checked = state.tg.bi;
            $("#tg-concise").checked = state.tg.concise;
            $("#tg-three").checked = state.tg.three;
            $("#tg-hint").checked = state.tg.hint;
            if ($("#conn")) $("#conn").value = state.tg.conn || "none";
            $$("#scen button").forEach(function (b) {
                b.className = b.getAttribute("data-sc") === state.sc ? "on" : "";
            });
            updateUndoBtn();
        }

        /* ============================ 弹层 ============================ */
        function openSlot(stepId, slotId, anchor) {
            var s = SLOTS[slotId];
            if (!s) return;
            popAnchor = anchor;
            var cur = state.slots[slotId] || "";
            var html = '<div class="pop-h"><b>' + esc(s.label) + '</b><span style="font-size:10.5px;color:#7b8794">' +
                esc(slotId) + '</span><button class="x" type="button" data-close="1">×</button></div>' +
                '<div class="pop-in"><input id="popInput" type="text" placeholder="' +
                esc(s.ph || "手动输入…") + '" value="' + esc(cur) + '"><button type="button" id="popOk">确定</button></div>' +
                '<div class="pop-list">';
            if (s.options && s.options.length) {
                s.options.forEach(function (o) {
                    html += '<button type="button" class="opt' + (o.en === cur ? " cur" : "") +
                        '" data-val="' + esc(o.en) + '"><div class="oe">' + esc(o.en) + '</div>' +
                        (o.cn ? '<div class="oc">' + esc(o.cn) + '</div>' : "") +
                        (o.note ? '<div class="on">' + esc(o.note) + '</div>' : "") + '</button>';
                });
            } else {
                html += '<div style="padding:10px;font-size:11.5px;color:#7b8794">这个词槽没有预设词条，直接在上方输入。</div>';
            }
            html += '</div><div class="pop-f"><button type="button" id="popClear">清空该槽</button>' +
                '<button type="button" id="popNext">跳到下一个未填</button></div>';

            pop.innerHTML = html;
            pop.hidden = false;
            pop.style.visibility = "hidden";
            pop.style.left = "0px";
            pop.style.top = "0px";

            var r = anchor.getBoundingClientRect();
            var pw = pop.offsetWidth || 340, ph = pop.offsetHeight || 320;
            var vw = window.innerWidth, vh = window.innerHeight;
            var left = Math.max(8, Math.min(r.left, vw - pw - 12));
            var top = r.bottom + 6;
            if (top + ph > vh - 10) top = Math.max(8, r.top - ph - 6);
            pop.style.left = left + "px";
            pop.style.top = top + "px";
            pop.style.visibility = "visible";

            var input = $("#popInput");
            if (input) {
                input.focus();
                input.select();
            }
            pop.setAttribute("data-step", stepId);
            pop.setAttribute("data-slot", slotId);
        }

        function closePop() {
            if (!pop) return;
            pop.hidden = true;
            popAnchor = null;
        }

        function setSlot(slotId, val) {
            pushUndo();
            if (val === "") delete state.slots[slotId];
            else state.slots[slotId] = val;
            render();
            closePop();
            toast("已更新：" + (SLOTS[slotId] ? SLOTS[slotId].label : slotId));
        }

        function nextEmpty() {
            var slots = $$("#preview .slot:not(.filled)");
            if (!slots.length) {
                toast("所有槽位都填好了");
                closePop();
                return;
            }
            var cur = pop.getAttribute("data-slot");
            for (var i = 0; i < slots.length; i++) {
                if (slots[i].getAttribute("data-slot") !== cur) {
                    var el = slots[i];
                    var st = el.getAttribute("data-step"), sl = el.getAttribute("data-slot");
                    closePop();
                    setTimeout(function () {
                        openSlot(st, sl, el);
                    }, 0);
                    el.scrollIntoView({block: "center"});
                    return;
                }
            }
            closePop();
        }

        /* ============================ 交互 ============================ */
        function toast(msg) {
            var t = $("#toast");
            if (!t) return;
            t.textContent = msg;
            t.className = "toast on";
            clearTimeout(t._tm);
            t._tm = setTimeout(function () {
                t.className = "toast";
            }, 1600);
        }

        function applyPreset(id) {
            var p = null;
            for (var i = 0; i < PRESETS.length; i++) {
                if (PRESETS[i].id === id) p = PRESETS[i];
            }
            if (!p) return;
            pushUndo();
            state.sc = p.sc;
            state.pid = p.id;
            state.sel = clone(p.sel);
            state.slots = clone(p.slots);
            state.tg.three = !!p.sel.p2_r3;
            render();
            toast("已载入：" + p.label);
        }

        function copyAll() {
            var parts = $$("#preview .en p");
            var txt = parts.map(function (p) {
                return p.textContent.replace(/\s+/g, " ").trim();
            }).join("\n\n");
            if (!txt) {
                toast("还没有内容");
                return;
            }
            var done = function () {
                toast("英文全文已复制");
            };
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(done, function () {
                        fallbackCopy(txt, done);
                    });
                    return;
                }
            } catch (e) {
            }
            fallbackCopy(txt, done);
        }

        function fallbackCopy(txt, done) {
            try {
                var ta = document.createElement("textarea");
                ta.value = txt;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                if (document.execCommand) document.execCommand("copy");
                document.body.removeChild(ta);
                done();
            } catch (e) {
                toast("复制失败，请手动选择");
            }
        }

        function bind() {
            document.addEventListener("click", function (e) {
                var t = e.target;
                if (!t || !t.closest) return;

                var chip = t.closest(".slot");
                if (chip) {
                    e.preventDefault();
                    openSlot(chip.getAttribute("data-step"), chip.getAttribute("data-slot"), chip);
                    return;
                }
                if (t.closest("#pop")) {
                    var opt = t.closest(".opt");
                    if (opt) {
                        setSlot(pop.getAttribute("data-slot"), opt.getAttribute("data-val"));
                        return;
                    }
                    if (t.closest("#popOk")) {
                        setSlot(pop.getAttribute("data-slot"), $("#popInput").value.trim());
                        return;
                    }
                    if (t.closest("#popClear")) {
                        setSlot(pop.getAttribute("data-slot"), "");
                        return;
                    }
                    if (t.closest("#popNext")) {
                        nextEmpty();
                        return;
                    }
                    if (t.closest("[data-close]")) {
                        closePop();
                        return;
                    }
                    return;
                }
                if (pop && !pop.hidden) closePop();
            });

            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") closePop();
                if (e.key === "Enter" && e.target && e.target.id === "popInput") {
                    setSlot(pop.getAttribute("data-slot"), e.target.value.trim());
                }
            });

            document.addEventListener("change", function (e) {
                var t = e.target;
                if (!t) return;
                if (t.id === "preset") {
                    if (t.value) applyPreset(t.value);
                    return;
                }
                if (t.matches && t.matches("select[data-step]")) {
                    pushUndo();
                    state.sel[t.getAttribute("data-step")] = t.value;
                    render();
                    return;
                }
                if (t.id === "conn") {
                    state.tg.conn = t.value;
                    render();
                    return;
                }
                var TG = {"tg-bi": "bi", "tg-concise": "concise", "tg-three": "three", "tg-hint": "hint"};
                if (TG[t.id]) {
                    state.tg[TG[t.id]] = !!t.checked;
                    render();
                }
            });

            var undoBtn = $("#undo");
            if (undoBtn) undoBtn.addEventListener("click", function () {
                if (!undoStack.length) return;
                var prev = undoStack.pop();
                try {
                    state = JSON.parse(prev);
                } catch (e) {
                    return;
                }
                render();
                toast("已撤销");
            });

            var clearBtn = $("#clear");
            if (clearBtn) clearBtn.addEventListener("click", function () {
                pushUndo();
                state.slots = {};
                state.sel = {};
                state.pid = "";
                render();
                toast("已清空，可撤销");
            });

            var copyBtn = $("#copy");
            if (copyBtn) copyBtn.addEventListener("click", copyAll);
            var copy2 = $("#copy2");
            if (copy2) copy2.addEventListener("click", copyAll);

            var scBox = $("#scen");
            if (scBox) scBox.addEventListener("click", function (e) {
                var b = e.target && e.target.closest ? e.target.closest("button[data-sc]") : null;
                if (!b) return;
                var sc = b.getAttribute("data-sc");
                if (sc === state.sc) return;
                pushUndo();
                state.sc = sc;
                render();
            });
        }

        /* ============================ 启动 ============================ */
        function init() {
            pop = $("#pop");

            var scBox = $("#scen");
            if (scBox) {
                SCENARIOS.forEach(function (s) {
                    var b = document.createElement("button");
                    b.type = "button";
                    b.setAttribute("data-sc", s.id);
                    b.innerHTML = s.label + "<small>" + s.sub + "</small>";
                    scBox.appendChild(b);
                });
            }

            var ps = $("#preset");
            if (ps) {
                var o0 = document.createElement("option");
                o0.value = "";
                o0.textContent = "— 载入真题预设 —";
                ps.appendChild(o0);
                PRESETS.forEach(function (p) {
                    var o = document.createElement("option");
                    o.value = p.id;
                    o.textContent = p.label;
                    ps.appendChild(o);
                });
            }

            loadState();
            bind();

            /* 支持 ?preset=xxx&sc=xxx 直达，便于分享与截图 */
            try {
                var qs = (location.search || "").replace(/^\?/, "").split("&");
                var map = {};
                qs.forEach(function (kv) {
                    var p2 = kv.split("=");
                    if (p2[0]) map[decodeURIComponent(p2[0])] = decodeURIComponent(p2[1] || "");
                });
                if (map.sc) {
                    SCENARIOS.forEach(function (x) {
                        if (x.id === map.sc) state.sc = map.sc;
                    });
                }
                if (map.preset) {
                    for (var i2 = 0; i2 < PRESETS.length; i2++) {
                        if (PRESETS[i2].id === map.preset) {
                            state.sc = PRESETS[i2].sc;
                            state.pid = PRESETS[i2].id;
                            state.sel = clone(PRESETS[i2].sel);
                            state.slots = clone(PRESETS[i2].slots);
                            state.tg.three = !!PRESETS[i2].sel.p2_r3;
                        }
                    }
                }
            } catch (e) {
            }

            render();
            updateUndoBtn();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    })();
</script>
</body>
</html>
